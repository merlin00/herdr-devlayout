name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: deps (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq dash
      - name: deps (macos)
        if: runner.os == 'macOS'
        run: brew install shellcheck jq
      - name: lint
        run: shellcheck -s sh bin/devlayout tests/run.sh
      - name: test (sh)
        run: sh tests/run.sh
      - name: test (dash)
        if: runner.os == 'Linux'
        run: dash tests/run.sh
